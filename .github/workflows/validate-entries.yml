name: Validate entries

on:
  pull_request:
    paths:
      - 'src/content/entries/**'
  push:
    branches: [main]
    paths:
      - 'src/content/entries/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
